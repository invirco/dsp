# /etc/systemd/system/d24-testui.service.d/s128-cores.conf
#
# WHEN THE DISPLAY DIES, LEAVE THE BODY (S128). On 2026-09-27 the app took a
# SIGSEGV twice -- 14:26:28 after 9 min 43 s of CPU and 12:52:47 after 27 min 30 s
# -- with NO managed stack trace either time, because the fault was in native
# code. A managed trace is all the app's own trace file can give, so without a
# core there is nothing to look at at all.
#
# The other half of this is the core pattern, which is a sysctl and not a service
# property: see 90-d24-cores.conf beside this file. Both are needed -- systemd's
# per-service default is LimitCORE=0, and the kernel's default `core_pattern` on
# this image is the bare name `core`, which writes into the working directory if
# it writes anything at all.
[Service]
LimitCORE=infinity
