# /etc/sysctl.d/90-d24-cores.conf -- S128
#
# Where a core goes. `/home/app/cores` is on the writable filesystem, is owned by
# the user the app runs as, and is not the working directory of anything, so a
# core cannot be mistaken for a file the app meant to write.
kernel.core_pattern=/home/app/cores/core.%e.%p.%t
fs.suid_dumpable=1
